[project]
name = "spectral-radius"
version = "0.1.0"
description = "Measure opinion polarization in surveys via the spectral radius of response covariance matrices"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dataframely>=3.1.2",
    "httpx>=0.28.1",
    "inflection>=0.5.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "numpy>=2.5.3",
    "plotnine>=0.14.5",
    "plotnine-theme",
    "polars>=1.30.0",
    "polars-utils",
    # plotnine needs pyarrow to convert polars frames via to_pandas
    "pyarrow>=20.0.0",
    "pyreadstat>=1.2.9",
]

[dependency-groups]
dev = [
    "ipython>=9.3.0",
    "pytest>=9.2.0",
]

[tool.uv.sources]
plotnine-theme = { git = "https://github.com/alipatti/plotnine_theme" }
polars-utils = { git = "https://github.com/alipatti/polars_utils" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the cached raw GSS data (data/raw/gss); deselect with -m 'not data'",
]
