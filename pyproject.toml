[project]
name = "spectral-radius"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gabriel",
    "great-tables>=0.20.0",
    "inflection>=0.5.1",
    "matplotlib>=3.10.3",
    "plotnine>=0.14.5",
    "plotnine-theme",
    "polars>=1.30.0",
    "polars-rng>=0.1.0",
    "polars-utils",
    "pyarrow>=20.0.0",
    "pyperclip>=1.11.0",
    "pyreadstat>=1.2.9",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "scipy>=1.15.3",
    "statsmodels>=0.14.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipython>=9.3.0",
]

[tool.uv.sources]
gabriel = { git = "https://github.com/hemanth-asirvatham/GABRIEL-prerelease" }
plotnine-theme = { git = "https://github.com/alipatti/plotnine_theme" }
polars-utils = { git = "https://github.com/alipatti/polars_utils" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
